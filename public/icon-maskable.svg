<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background for maskable icons (Safe Zone is center 80%) -->
  <rect width="512" height="512" fill="#4f46e5"/>
  
  <!-- Content - scaled down to fit comfortably within the 80% safe zone (center 410px) -->
  <g transform="translate(102, 102) scale(0.6)">
    <!-- Compass Circle -->
    <circle cx="256" cy="256" r="220" stroke="white" stroke-width="40" fill="none" opacity="0.9" />
    
    <!-- Compass Needle -->
    <path d="M256 60 L320 256 L256 452 L192 256 Z" fill="white" />
    
    <!-- Shading for the needle -->
    <path d="M256 60 L256 256 L192 256 Z" fill="#c7d2fe" />
    
    <!-- Center Point -->
    <circle cx="256" cy="256" r="30" fill="#4f46e5" stroke="white" stroke-width="10" />
  </g>
</svg>
